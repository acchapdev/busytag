[project]
name = "busytag"
version = "0.1.0"
description = "CLI and AI-agent status board for the Busy Tag USB display (Claude Code, OpenCode)"
readme = "README.md"
authors = [
    { name = "acchapm1", email = "acchapm1@asu.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "pillow>=13.0.0",
    "pyserial>=3.5",
    "tomlkit>=0.15.2",
    "typer>=0.28.0",
]

[project.scripts]
busytag = "busytag:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
