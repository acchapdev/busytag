; Firmware for the Waveshare ESP32-C6-LCD-1.47 as a busytag agent-status display.
; Build and flash with `just fw-flash` from the repository root.

[env:waveshare-c6-lcd]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
board_upload.flash_size = 8MB
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0
  adafruit/Adafruit GFX Library@^1.12.1
  bblanchon/ArduinoJson@^7.4.2
