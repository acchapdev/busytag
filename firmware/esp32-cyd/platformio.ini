; Firmware for the ESP32-2432S028 "Cheap Yellow Display" (CYD) as a busytag agent-status
; display with touch. Build and flash with `just cyd-flash` from the repository root.

[env:cyd]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
; The CH340 drops bytes above 115200 on this board (seen while reading flash at 460800)
upload_speed = 115200
lib_deps =
  adafruit/Adafruit ILI9341@^1.6.1
  adafruit/Adafruit GFX Library@^1.12.1
  bblanchon/ArduinoJson@^7.4.2
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
